<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter Game - Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-gradient: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #10b981 100%);
            --game-bg: #000;
            --text-color: #ffffff;
            --accent-color: #06b6d4;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
            --game-bg: #0a0a0a;
            --text-color: #f1f5f9;
            --accent-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--game-bg);
            color: var(--text-color);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            transition: all 0.3s ease;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: radial-gradient(ellipse at center, #001122 0%, #000000 100%);
            border: 2px solid #333;
        }
        
        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        .score {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .lives {
            font-size: 1.2rem;
            color: #ff6b6b;
            margin-top: 10px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 1rem;
            border-radius: 10px;
        }
        
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #fff;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 2rem;
            border-radius: 15px;
            border: 2px solid #ff6b6b;
            display: none;
        }
        
        .restart-btn {
            background: #00ff00;
            color: black;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .game-container {
                border-radius: 10px;
                overflow: hidden;
            }
            
            #gameCanvas {
                width: 100%;
                height: 60vh;
                max-width: 100vw;
                border: 1px solid #333;
            }
            
            .controls {
                position: fixed;
                bottom: 10px;
                left: 10px;
                right: 10px;
                background: rgba(0,0,0,0.9);
                padding: 0.75rem;
                border-radius: 8px;
                font-size: 0.9rem;
            }
            
            .game-ui {
                top: 10px;
                left: 10px;
            }
            
            .score {
                font-size: 1.2rem;
            }
            
            .back-btn {
                top: 10px;
                right: 10px;
                left: auto;
                padding: 8px 16px;
                font-size: 0.9rem;
            }
            
            .game-over {
                padding: 1.5rem;
                margin: 0 10px;
            }
            
            .restart-btn {
                padding: 1rem 2rem;
                font-size: 1.1rem;
                touch-action: manipulation;
            }
            
            .mobile-controls {
                display: block !important;
                position: fixed;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                padding: 1rem;
                border-radius: 10px;
            }
            
            .mobile-btn {
                background: rgba(255,255,255,0.2);
                border: 2px solid #fff;
                color: white;
                padding: 1rem;
                border-radius: 8px;
                font-size: 1.2rem;
                touch-action: manipulation;
                user-select: none;
            }
            
            .mobile-btn:active {
                background: rgba(255,255,255,0.4);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="../index.html" class="back-btn">← Back to Demos</a>
        
        <div class="game-ui">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="lives">Lives: <span id="lives">3</span></div>
        </div>
        
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="controls">
            <p>🎮 <strong>Controls:</strong> Arrow Keys to Move • Spacebar to Shoot</p>
            <p>📱 <strong>Mobile:</strong> Touch screen to move and shoot</p>
            <p>🎯 Destroy enemies to earn points!</p>
        </div>
        
        <div class="mobile-controls" id="mobileControls" style="display: none;">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; max-width: 300px; margin: 0 auto;">
                <button class="mobile-btn" ontouchstart="mobileControl('left')" ontouchend="mobileControlEnd('left')">←</button>
                <button class="mobile-btn" ontouchstart="mobileControl('up')" ontouchend="mobileControlEnd('up')">↑</button>
                <button class="mobile-btn" ontouchstart="mobileControl('right')" ontouchend="mobileControlEnd('right')">→</button>
                <div></div>
                <button class="mobile-btn" ontouchstart="mobileControl('down')" ontouchend="mobileControlEnd('down')">↓</button>
                <button class="mobile-btn" ontouchstart="mobileControl('shoot')" ontouchend="mobileControlEnd('shoot')">🔫</button>
            </div>
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>🚀 Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button class="restart-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameRunning = true;
        let score = 0;
        let lives = 3;
        
        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 60,
            width: 50,
            height: 40,
            speed: 5
        };
        
        // Arrays for game objects
        let bullets = [];
        let enemies = [];
        let stars = [];
        
        // Input handling
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        // Initialize stars for background
        function initStars() {
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: Math.random() * 2 + 1,
                    size: Math.random() * 2
                });
            }
        }
        
        // Draw functions
        function drawPlayer() {
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw player as a simple spaceship
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 20, player.y - 10, 10, 15);
        }
        
        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }
        
        function drawEnemies() {
            ctx.fillStyle = '#ff0000';
            enemies.forEach(enemy => {
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });
        }
        
        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
        }
        
        // Update functions
        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
            if (keys['ArrowUp'] && player.y > 0) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] && player.y < canvas.height - player.height) {
                player.y += player.speed;
            }
            if (keys['Space']) {
                shoot();
                keys['Space'] = false; // Prevent rapid fire
            }
        }
        
        function shoot() {
            bullets.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                width: 4,
                height: 10,
                speed: 7
            });
        }
        
        function updateBullets() {
            bullets = bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > 0;
            });
        }
        
        function updateEnemies() {
            // Spawn new enemies
            if (Math.random() < 0.02) {
                enemies.push({
                    x: Math.random() * (canvas.width - 40),
                    y: -40,
                    width: 40,
                    height: 30,
                    speed: Math.random() * 3 + 2
                });
            }
            
            // Move enemies
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                
                // Check collision with player
                if (enemy.x < player.x + player.width &&
                    enemy.x + enemy.width > player.x &&
                    enemy.y < player.y + player.height &&
                    enemy.y + enemy.height > player.y) {
                    lives--;
                    updateUI();
                    if (lives <= 0) {
                        gameOver();
                    }
                    return false;
                }
                
                return enemy.y < canvas.height;
            });
        }
        
        function updateStars() {
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }
        
        function checkCollisions() {
            bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y) {
                        
                        // Remove bullet and enemy
                        bullets.splice(bulletIndex, 1);
                        enemies.splice(enemyIndex, 1);
                        
                        // Increase score
                        score += 10;
                        updateUI();
                    }
                });
            });
        }
        
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function restartGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            bullets = [];
            enemies = [];
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 60;
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
        }
        
        // Game loop
        function gameLoop() {
            if (!gameRunning) {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Update
            updateStars();
            updatePlayer();
            updateBullets();
            updateEnemies();
            checkCollisions();
            
            // Draw
            drawStars();
            drawPlayer();
            drawBullets();
            drawEnemies();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Mobile controls
        function mobileControl(direction) {
            keys['Arrow' + direction.charAt(0).toUpperCase() + direction.slice(1)] = true;
            if (direction === 'shoot') {
                keys['Space'] = true;
            }
        }
        
        function mobileControlEnd(direction) {
            keys['Arrow' + direction.charAt(0).toUpperCase() + direction.slice(1)] = false;
            if (direction === 'shoot') {
                keys['Space'] = false;
            }
        }
        
        // Touch controls for canvas
        let touchStartX = 0;
        let touchStartY = 0;
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = touch.clientX - rect.left;
            touchStartY = touch.clientY - rect.top;
            
            // Shoot on touch
            shoot();
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const touchX = touch.clientX - rect.left;
            const touchY = touch.clientY - rect.top;
            
            // Move player towards touch position
            const targetX = (touchX / canvas.width) * canvas.width - player.width / 2;
            const targetY = (touchY / canvas.height) * canvas.height - player.height / 2;
            
            player.x = Math.max(0, Math.min(canvas.width - player.width, targetX));
            player.y = Math.max(0, Math.min(canvas.height - player.height, targetY));
        });
        
        // Initialize and start game
        initStars();
        updateUI();
        gameLoop();
    </script>
</body>
</html>
