<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .game-area {
            padding: 2rem;
            text-align: center;
        }
        
        .choices {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
        }
        
        .choice-btn {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 15px;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 4rem;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .choice-btn:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .result-area {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            margin: 2rem 0;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .battle {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 2rem 0;
        }
        
        .player-choice, .computer-choice {
            text-align: center;
        }
        
        .choice-display {
            font-size: 6rem;
            margin-bottom: 1rem;
        }
        
        .vs {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .result-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        
        .win { color: #28a745; }
        .lose { color: #dc3545; }
        .tie { color: #ffc107; }
        
        .score {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin: 2rem 0;
        }
        
        .score-item {
            text-align: center;
            background: #e9ecef;
            padding: 1rem;
            border-radius: 10px;
            min-width: 100px;
        }
        
        .score-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .reset-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .choices {
                flex-direction: column;
                align-items: center;
            }
            
            .battle {
                flex-direction: column;
                gap: 1rem;
            }
            
            .choice-display {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back to Demos</a>
    
    <div class="container">
        <div class="header">
            <h1>✂️ Rock Paper Scissors</h1>
            <p>Classic game against the computer - Choose your weapon!</p>
        </div>
        
        <div class="game-area">
            <h3>Make Your Choice:</h3>
            <div class="choices">
                <div class="choice-btn" onclick="playGame('rock')">
                    🪨
                </div>
                <div class="choice-btn" onclick="playGame('paper')">
                    📄
                </div>
                <div class="choice-btn" onclick="playGame('scissors')">
                    ✂️
                </div>
            </div>
            
            <div class="result-area" id="resultArea">
                <p style="color: #666; font-size: 1.2rem;">Choose Rock, Paper, or Scissors to start playing!</p>
            </div>
            
            <div class="score">
                <div class="score-item">
                    <div class="score-number" id="playerScore">0</div>
                    <div>You</div>
                </div>
                <div class="score-item">
                    <div class="score-number" id="ties">0</div>
                    <div>Ties</div>
                </div>
                <div class="score-item">
                    <div class="score-number" id="computerScore">0</div>
                    <div>Computer</div>
                </div>
            </div>
            
            <button class="reset-btn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script>
        let playerScore = 0;
        let computerScore = 0;
        let ties = 0;
        
        const choices = ['rock', 'paper', 'scissors'];
        const emojis = {
            rock: '🪨',
            paper: '📄',
            scissors: '✂️'
        };
        
        function getComputerChoice() {
            return choices[Math.floor(Math.random() * choices.length)];
        }
        
        function determineWinner(playerChoice, computerChoice) {
            if (playerChoice === computerChoice) {
                return 'tie';
            }
            
            if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                return 'win';
            }
            
            return 'lose';
        }
        
        function playGame(playerChoice) {
            const computerChoice = getComputerChoice();
            const result = determineWinner(playerChoice, computerChoice);
            
            // Update scores
            if (result === 'win') {
                playerScore++;
            } else if (result === 'lose') {
                computerScore++;
            } else {
                ties++;
            }
            
            // Display result
            displayResult(playerChoice, computerChoice, result);
            updateScore();
        }
        
        function displayResult(playerChoice, computerChoice, result) {
            const resultArea = document.getElementById('resultArea');
            
            let resultText = '';
            let resultClass = '';
            
            switch (result) {
                case 'win':
                    resultText = 'You Win! 🎉';
                    resultClass = 'win';
                    break;
                case 'lose':
                    resultText = 'Computer Wins! 🤖';
                    resultClass = 'lose';
                    break;
                case 'tie':
                    resultText = "It's a Tie! 🤝";
                    resultClass = 'tie';
                    break;
            }
            
            resultArea.innerHTML = `
                <div class="battle">
                    <div class="player-choice">
                        <div class="choice-display">${emojis[playerChoice]}</div>
                        <div>You</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="computer-choice">
                        <div class="choice-display">${emojis[computerChoice]}</div>
                        <div>Computer</div>
                    </div>
                </div>
                <div class="result-text ${resultClass}">${resultText}</div>
                <p style="margin-top: 1rem; color: #666;">
                    ${getResultExplanation(playerChoice, computerChoice, result)}
                </p>
            `;
        }
        
        function getResultExplanation(playerChoice, computerChoice, result) {
            if (result === 'tie') {
                return `Both chose ${playerChoice}!`;
            }
            
            const explanations = {
                'rock-scissors': 'Rock crushes Scissors',
                'paper-rock': 'Paper covers Rock',
                'scissors-paper': 'Scissors cuts Paper',
                'scissors-rock': 'Rock crushes Scissors',
                'rock-paper': 'Paper covers Rock',
                'paper-scissors': 'Scissors cuts Paper'
            };
            
            const key = result === 'win' ? `${playerChoice}-${computerChoice}` : `${computerChoice}-${playerChoice}`;
            return explanations[key] || '';
        }
        
        function updateScore() {
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
            document.getElementById('ties').textContent = ties;
        }
        
        function resetGame() {
            playerScore = 0;
            computerScore = 0;
            ties = 0;
            updateScore();
            
            document.getElementById('resultArea').innerHTML = 
                '<p style="color: #666; font-size: 1.2rem;">Choose Rock, Paper, or Scissors to start playing!</p>';
        }
    </script>
</body>
</html>
