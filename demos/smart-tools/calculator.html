<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calculator - Python Project Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .calculator {
            padding: 2rem;
        }
        
        .display {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            min-height: 60px;
            display: flex;
            align-items: center;
        }
        
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 2rem;
        }
        
        .btn {
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-number {
            background: #e9ecef;
            color: #333;
        }
        
        .btn-operator {
            background: #667eea;
            color: white;
        }
        
        .btn-equals {
            background: #28a745;
            color: white;
            grid-column: span 2;
        }
        
        .btn-clear {
            background: #dc3545;
            color: white;
        }
        
        .history {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .history h3 {
            margin-bottom: 1rem;
            color: #333;
        }
        
        .history-item {
            padding: 0.5rem;
            border-bottom: 1px solid #dee2e6;
            font-family: 'Courier New', monospace;
        }
        
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 10px;
            }
            
            .header {
                padding: 1.5rem 1rem;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
            
            .calculator {
                padding: 1rem;
            }
            
            .buttons {
                gap: 8px;
            }
            
            .btn {
                padding: 1.2rem;
                font-size: 1.2rem;
                touch-action: manipulation;
                min-height: 60px;
            }
            
            .display {
                padding: 1.2rem;
                font-size: 1.4rem;
                min-height: 80px;
            }
            
            .history {
                max-height: 150px;
                padding: 0.75rem;
            }
            
            .back-btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <a href="../index.html" class="back-btn">← Back to Demos</a>
    
    <div class="container">
        <div class="header">
            <h1>🧮 Interactive Calculator</h1>
            <p>Experience the Python calculator project in your browser</p>
        </div>
        
        <div class="calculator">
            <div class="display" id="display">0</div>
            
            <div class="buttons">
                <button class="btn btn-clear" onclick="clearDisplay()">C</button>
                <button class="btn btn-clear" onclick="clearEntry()">CE</button>
                <button class="btn btn-operator" onclick="appendToDisplay('/')">/</button>
                <button class="btn btn-operator" onclick="appendToDisplay('*')">×</button>
                
                <button class="btn btn-number" onclick="appendToDisplay('7')">7</button>
                <button class="btn btn-number" onclick="appendToDisplay('8')">8</button>
                <button class="btn btn-number" onclick="appendToDisplay('9')">9</button>
                <button class="btn btn-operator" onclick="appendToDisplay('-')">-</button>
                
                <button class="btn btn-number" onclick="appendToDisplay('4')">4</button>
                <button class="btn btn-number" onclick="appendToDisplay('5')">5</button>
                <button class="btn btn-number" onclick="appendToDisplay('6')">6</button>
                <button class="btn btn-operator" onclick="appendToDisplay('+')">+</button>
                
                <button class="btn btn-number" onclick="appendToDisplay('1')">1</button>
                <button class="btn btn-number" onclick="appendToDisplay('2')">2</button>
                <button class="btn btn-number" onclick="appendToDisplay('3')">3</button>
                <button class="btn btn-equals" onclick="calculate()" rowspan="2">=</button>
                
                <button class="btn btn-number" onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
                <button class="btn btn-number" onclick="appendToDisplay('.')">.</button>
            </div>
            
            <div class="history">
                <h3>📝 Calculation History</h3>
                <div id="history-list">
                    <div class="history-item">Welcome! Start calculating...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let display = document.getElementById('display');
        let historyList = document.getElementById('history-list');
        let currentInput = '0';
        let history = [];

        function appendToDisplay(value) {
            if (currentInput === '0' && value !== '.') {
                currentInput = value;
            } else {
                currentInput += value;
            }
            display.textContent = currentInput;
        }

        function clearDisplay() {
            currentInput = '0';
            display.textContent = currentInput;
        }

        function clearEntry() {
            currentInput = currentInput.slice(0, -1) || '0';
            display.textContent = currentInput;
        }

        function calculate() {
            try {
                // Replace × with * for calculation
                let expression = currentInput.replace(/×/g, '*');
                let result = eval(expression);
                
                // Add to history
                let historyItem = `${currentInput} = ${result}`;
                history.unshift(historyItem);
                
                // Update history display
                updateHistory();
                
                // Update display
                currentInput = result.toString();
                display.textContent = currentInput;
                
            } catch (error) {
                display.textContent = 'Error';
                currentInput = '0';
            }
        }

        function updateHistory() {
            historyList.innerHTML = '';
            history.slice(0, 10).forEach(item => {
                let historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.textContent = item;
                historyList.appendChild(historyItem);
            });
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ('0123456789.+-*/'.includes(key)) {
                appendToDisplay(key === '*' ? '×' : key);
            } else if (key === 'Enter' || key === '=') {
                calculate();
            } else if (key === 'Escape') {
                clearDisplay();
            } else if (key === 'Backspace') {
                clearEntry();
            }
        });
    </script>
</body>
</html>
